name: Update Profile Showcase Repositories

on:
  schedule:
    # هر ۲۴ ساعت یک‌بار به‌صورت خودکار اجرا می‌شود
    - cron: '0 0 * * *'
  # امکان اجرای دستی با یک دکمه در تب Actions
  workflow_dispatch:
  # هر زمان که تغییری در این مخزن پوش شود
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-showcase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run Showcase Updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit & Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(showcase): auto-sync repositories list [skip ci]" && git push)
